services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      USE_OLLAMA: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      OLLAMA_MODEL: qwen2.5:1.5b
